# Long English prompt with three distinct people, screen positions and handedness.
# Offline: python cp2.py examples/natural-language-spatial.yaml --output outputs/natural-language-spatial.json
# Mirrored layout: add --profile abc_left_to_right (hand assignments stay unchanged).
#
# Default, from the viewer's RIGHT to LEFT: A / Aria, B / Bram, C / Celia.
# All three face the viewer. "Right hand" always means that person's own right hand.
# A's sword therefore appears to the left of A's torso; her shield appears to its right.
# YAML variable names and A/B/C are authoring identifiers, not image labels.
# Position and prop ownership are stated together in sentences, not as unordered tags.
# These instructions describe intended relationships; image adherence needs visual checking.
# Phrase variables come first; sentence/paragraph templates follow them.
# Replace a whole phrase, not individual words: e.g. hair_main = long brown hair.
# Keep the same noun number, grammatical role and viewpoint for alternatives.
version: 2
options:
  json: true
  output: null
methods:
  - random: 1
command:
  prompt: |-
    ${scene}

    ${layout}

    ${person_a}

    ${person_b}

    ${person_c}

    ${spatial_details}

    ${dessin} ${effects}
  negative_prompt: ''
variables:
  scene_medium:
    - An anime-style illustration
  scene_group:
    - three adult travellers
  scene_ground:
    - on the same stone terrace
  scene_gate_position:
    - outside a small castle gate
  scene_time:
    - at sunset
  frame_extent:
    - from head to toe
  background_wall:
    - a low parapet behind them
  background_gate:
    - the open gate farther in the background
  group_formation:
    - a single row
  group_facing:
    - face directly toward the viewer
  group_separation:
    - Small gaps
  separated_parts:
    - each person's hands, clothing and belongings
  person_a_identity:
    - a young woman
  person_a_hair:
    - short auburn hair
  person_a_tabard:
    - a red tabard
  person_a_armour:
    - fitted silver armour
  person_a_arm_position:
    - hangs slightly away from her body
  person_a_sword_direction:
    - pointing diagonally downward
  person_a_sword_target:
    - toward a clear patch of stone
  person_a_shield_position:
    - in front of the left side of her waist
  person_a_visible_parts:
    - Her face, sword hand and shield grip
  person_b_identity:
    - a broad-shouldered man
  person_b_hair:
    - dark curly hair
  person_b_beard:
    - a short beard
  person_b_coat:
    - a brown travelling coat
  person_b_shirt:
    - a cream shirt
  person_b_map:
    - an unfolded parchment map
  person_b_hand_assignment:
    - in both hands
  person_b_map_height:
    - at chest height
  person_b_map_grip:
    - grip opposite edges of the map
  person_b_face_visibility:
    - visible above the top edge of the parchment
  person_c_identity:
    - a tall woman
  person_c_hair:
    - long pale-blonde hair
  person_c_cloak:
    - a deep-${person_c_cloak_colour} cloak
  person_c_cloak_colour:
    - blue
  person_c_dress:
    - a plain dark travelling dress
  person_c_staff:
    - a wooden staff
  person_c_staff_orientation:
    - upright
  person_c_hand_assignment:
    - in her own right hand
  person_c_staff_position:
    - beside her right boot
  person_c_free_hand_position:
    - open at waist height
  person_c_free_hand_gesture:
    - a small conversational gesture
  body_reference_facing:
    - face forward
  body_reference_right:
    - each person's own right hand
  body_reference_screen:
    - on the viewer's left side of that person's body
  group_middle_relation:
    - between the two women
  group_foot_alignment:
    - on the same line of paving stones
  prop_ownership_space:
    - within their owners' immediate space
  figure_gaps:
    - clear gaps between the figures
  gate_layer:
    - behind the group
  terrace_layer:
    - across the foreground
  linework_main:
    - Clean anime linework
  shading_main:
    - restrained cel shading
  detail_focus:
    - the hands and the objects they hold
  viewpoint_height:
    - at chest height
  frame_contents:
    - the complete sword blade, shield, map, staff and all three pairs of boots
  light_main:
    - Warm sunset light
  light_origin:
    - from the upper left of the image
  light_surfaces:
    - the edges of the armour and the folds of the ${person_c_cloak_colour} cloak
  shadows_main:
    - Soft shadows
  shadow_direction:
    - toward the lower right
  background_detail:
    - less detailed than the travellers
  readability_target:
    - the three faces and their separate silhouettes
  person_a_name:
    - Aria
  person_b_name:
    - Bram
  person_c_name:
    - Celia
  person_a_position:
    - on the right side of the image
  person_b_position:
    - in the centre of the image
  person_c_position:
    - on the left side of the image
  person_a_right_hand:
    - a straight steel sword
  person_a_left_hand:
    - a round wooden shield with a steel rim
  scene:
    - >-
      ${scene_medium} shows ${scene_group} standing ${scene_ground} ${scene_gate_position} ${scene_time}.
      The terrace is wide enough for all three to be seen ${frame_extent}, with ${background_wall} and
      ${background_gate}.
  layout:
    - >-
      ${person_a_name} stands ${person_a_position}, ${person_b_name} stands ${person_b_position}, and
      ${person_c_name} stands ${person_c_position}. They form ${group_formation} and ${group_facing}.
      ${group_separation} separate their silhouettes, so ${separated_parts} can be distinguished.
  person_a:
    - >-
      ${person_a_name} is ${person_a_identity} with ${person_a_hair} and ${person_a_tabard} worn over
      ${person_a_armour}. She holds ${person_a_right_hand} in her right hand. Her left hand grips ${person_a_left_hand}.
      Her right arm ${person_a_arm_position}, with the sword ${person_a_sword_direction} ${person_a_sword_target}.
      Her left elbow is bent, bringing the shield ${person_a_shield_position}. ${person_a_visible_parts}
      are visible.
  person_b:
    - >-
      ${person_b_name} is ${person_b_identity} with ${person_b_hair}, ${person_b_beard} and ${person_b_coat}
      over ${person_b_shirt}. He holds ${person_b_map} ${person_b_hand_assignment} ${person_b_map_height}.
      His fingers ${person_b_map_grip}, and its lower corners curl gently toward his coat. His head is
      raised, allowing his face to remain ${person_b_face_visibility}.
  person_c:
    - >-
      ${person_c_name} is ${person_c_identity} with ${person_c_hair}, ${person_c_cloak} and ${person_c_dress}.
      She holds ${person_c_staff} ${person_c_staff_orientation} ${person_c_hand_assignment}, with its
      lower end resting on the terrace ${person_c_staff_position}. Her left hand is ${person_c_free_hand_position}
      in ${person_c_free_hand_gesture}. The staff belongs to her and remains beside her body, clearly
      separate from the sword and shield carried by ${person_a_name}.
  spatial_details:
    - >-
      Because they ${body_reference_facing}, ${body_reference_right} appears ${body_reference_screen}.
      ${person_b_name} stands ${group_middle_relation}, with all three pairs of feet resting ${group_foot_alignment}.
      The weapons, staff and map stay ${prop_ownership_space}, leaving ${figure_gaps}. The castle gate
      rises ${gate_layer}, while the terrace continues ${terrace_layer}.
  dessin:
    - >-
      ${linework_main} and ${shading_main} define the figures, with particular attention to ${detail_focus}.
      The viewpoint is ${viewpoint_height}, and the framing includes ${frame_contents}.
  effects:
    - >-
      ${light_main} enters ${light_origin}, tracing ${light_surfaces}. ${shadows_main} fall across the
      stone ${shadow_direction}. The distant gate is ${background_detail}, keeping ${readability_target}
      easy to read.
profiles:
  abc_left_to_right:
    variables:
      person_a_position:
        - on the left side of the image
      person_c_position:
        - on the right side of the image
