# Change model/encoder/VAE filenames to match files installed on your server.
# Neo: python cp2.py examples/qwen21-moss.yaml --profile qwen21 --api-mode
# Neo: python cp2.py examples/qwen21-moss.yaml --profile moss --api-mode
# Turbo: use --profile qwen21-turbo; Neo requires neo-qwen21-turbo-scheduler.py
# copied into the server's scripts/ directory, followed by a restart.
# ComfyUI 0.42+: add --comfy --ui-type comfy --api-base http://localhost:8188
# instead of --api-mode. An explicit --comfy-family overrides model_type.
# Ordinary img2img: add --image input.png (Neo also needs --api-type img2img).
# Neo Qwen editing: add --reference-image reference.png to the txt2img command.
version: 2
options:
  ui_type: neo
  image_type: png
methods:
  - random: 1
profiles:
  qwen21:
    options:
      model: qwen_image_2.1_int8_convrot.safetensors
      model_type: qwen-image2.1
  moss:
    options:
      model: moss_image_sft_int8_convrot.safetensors
      model_type: moss-image
  qwen21-turbo:
    options:
      model: qwen_image_2.1_turbo_int8_convrot.safetensors
      model_type: qwen-image-2.1-turbo
command:
  prompt: a red ceramic teapot on a wooden table, daylight
  negative_prompt: blurry
  width: 1024
  height: 1024
  seed: 41006
model_profile:
  qwen-image-2.1:
    options:
      text_encoder: qwen3vl_8b_int8_convrot.safetensors
      vae: qwen_image_2.1_vae_bf16.safetensors
    command:
      steps: 32
      cfg_scale: 2.5
  moss:
    options:
      text_encoder: qwen3.5_9b_w4a8_gptq.safetensors
      vae: flux2-vae_small.safetensors
    command:
      steps: 50
      cfg_scale: 3.0
  qwen-image-2.1-turbo:
    command:
      steps: 8
      cfg_scale: 1
ui_profile:
  neo:
    command:
      sampler_name: Euler
      scheduler: Simple
  comfy:
    command:
      sampler_name: euler
      scheduler: simple
