version: 2
options:
  output: null
  ui_type: neo
  model_type: anima
  # Uses the currently selected Anima checkpoint and its modules.
  # Set sd_model / vae / text_encoder or use the corresponding CLI options.
  # sd_vae remains accepted as a legacy alias for vae.
  image_type: png
methods:
  - random: 1
command:
  prompt: a red ceramic teapot on a wooden table, daylight
  negative_prompt: blurry
  seed: -1
  save_images: false
model_profile:
  anima:
    options:
      vae: qwen_image_vae.safetensors
      text_encoder: Qwen3-0.6B-Base.Q8_0.gguf
    command:
      width: 1024
      height: 1024
      steps: 24
      cfg_scale: 4
  anima_2.9b: null
  anima_3.8b: null
  krea2:
    options:
      vae: qwen_image_vae.safetensors
      text_encoder: qwen3vl_4b_fp8_scaled.safetensors
    command:
      width: 1024
      height: 1024
      steps: 8
      cfg_scale: 1

ui_profile:
  neo:
    command:
      sampler_name: Euler
      scheduler: Normal
